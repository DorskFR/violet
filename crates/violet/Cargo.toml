[package]
name = "violet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Drop documents in a folder; violet reads, splits, names and files them, and serves a search UI."

[lints]
workspace = true

[dependencies]
violet-core.workspace = true
violet-pdf.workspace = true
violet-model.workspace = true
anyhow.workspace = true
argon2 = "0.6"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
kagi = { git = "https://github.com/DorskFR/kagi", tag = "v0.2.1" }
mail-parser = "1.0.1"
mime_guess = "2"
notify = "8"
quick-xml = "0.41"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "charset"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
rustls-native-certs = "0.8.5"
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
lopdf = "0.47"
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
