[package]
name = "violet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Drop documents in a folder; violet reads, splits, names and files them, and serves a search UI."

[lints]
workspace = true

[dependencies]
violet-core.workspace = true
violet-pdf.workspace = true
violet-model.workspace = true
anyhow.workspace = true
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
mime_guess = "2"
notify = "8"
quick-xml = "0.41"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tower-http = { version = "0.7", features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
lopdf = "0.47"
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
